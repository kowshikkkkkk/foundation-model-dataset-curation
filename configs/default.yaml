seed: 42
input_paths:
  - data/raw/sample.jsonl
output_dir: data/curated

normalize:
  unicode_form: NFKC
  collapse_whitespace: true

quality:
  min_chars: 20
  max_chars: 100000
  max_line_repetition: 0.3
  min_alpha_ratio: 0.6

safety:
  pii_action: redact
  blocklist: []

dedup:
  shingle_size: 5
  num_perm: 128
  lsh_threshold: 0.8

language:
  allowed: [en]
  min_confidence: 0.9
  min_detect_chars: 40

contamination:
  ngram_size: 13
  benchmarks: [gsm8k]