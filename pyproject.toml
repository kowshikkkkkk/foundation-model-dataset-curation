[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-curation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "datasketch",
    "langdetect",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]
data = ["datasets"]

[tool.setuptools.packages.find]
where = ["src"]